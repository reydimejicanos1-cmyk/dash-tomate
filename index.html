* { box-sizing: border-box; margin: 0; padding: 0; }

body {

  background: #F4F0E4;
  min-height: 100vh;
  color: #2E3420;
  padding: 0 0 60px 0;
}

input::placeholder { color: #A69A78; }

.card-hover { transition: all 0.15s ease; cursor: pointer; }
.card-hover:hover { background: #F0EAD8 !important; border-color: #A8B87A !important; }

.mono { font-family: 'JetBrains Mono', monospace; }
.serif { font-family: 'Fraunces', serif; }

.header {
  background: linear-gradient(135deg, #3A4526 0%, #2E3420 100%);
  padding: 32px 40px 28px;
  border-bottom: 3px solid #8C5A22;
  position: relative;
  overflow: hidden;
}
.header::after {
  content: '';
  position: absolute; right: -40px; top: -60px; width: 260px; height: 260px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(214,138,63,0.15) 0%, transparent 70%);
}
.header .eyebrow {
  font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
  color: #C9A876; margin-bottom: 6px;
}
.header h1 {
  font-size: 34px; font-weight: 700; color: #F4F0E4; letter-spacing: -0.01em;
}
.header .sub { font-size: 14px; color: #B8C299; margin-top: 6px; }

.container { padding: 28px 40px; max-width: 1280px; margin: 0 auto; }

.selector-bar {
  display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  margin-bottom: 24px; background: #FBF8F1; border: 1px solid #DCD3BE;
  border-radius: 6px; padding: 14px 18px;
}
.selector-bar .label {
  font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #8A7F63;
}
.selector-bar input[type="text"] {
  flex: 1; min-width: 220px; padding: 8px 12px; border-radius: 4px;
  border: 1px solid #DCD3BE; font-family: 'Inter', sans-serif;
  font-size: 14px; background: #FFFDF8; color: #2E3420; outline: none;
}
.mun-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
.mun-btn {
  padding: 7px 14px; border-radius: 20px; border: 1px solid #DCD3BE;
  background: #FFFDF8; color: #4A4530;
  font-family: 'JetBrains Mono', monospace; font-size: 12px;
  cursor: pointer; transition: all 0.15s ease;
}
.mun-btn.active { background: #6B7F3E; border-color: #6B7F3E; color: #F4F0E4; }

#resultList {
  background: #FBF8F1; border: 1px solid #DCD3BE; border-radius: 6px;
  margin-bottom: 24px; max-height: 280px; overflow-y: auto; display: none;
}
.result-row {
  padding: 10px 16px; border-bottom: 1px solid #E8E2D0;
  display: flex; justify-content: space-between; align-items: center;
}
.result-row .name { font-family: 'Fraunces', serif; font-size: 15px; color: #2E3420; }
.result-row .meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A7F63; }
.result-row .rid { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A69A78; }
.empty-msg { padding: 16px; color: #8A7F63; font-size: 14px; }

#profileView {
  background: #FFFDF8; border: 1px solid #DCD3BE; border-radius: 8px;
  padding: 26px 28px; margin-bottom: 28px; position: relative; display: none;
}
.back-btn {
  position: absolute; top: 20px; right: 20px; background: transparent;
  border: 1px solid #DCD3BE; border-radius: 4px; padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A7F63; cursor: pointer;
}
.profile-eyebrow {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; color: #8C5A22; margin-bottom: 4px;
}
.profile-title { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700; color: #2E3420; margin: 0 0 20px 0; }

.profile-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 20px; margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid #E8E2D0;
}
.pfield-label {
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  letter-spacing: 0.08em; text-transform: uppercase; color: #A69A78; margin-bottom: 3px;
}
.pfield-value { font-family: 'Fraunces', serif; font-size: 16px; color: #2E3420; }

.profile-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
.section-label {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; color: #8A7F63; margin-bottom: 10px; margin-top: 18px;
}
.section-label:first-child { margin-top: 0; }

.tag {
  display: inline-block; padding: 3px 9px; border-radius: 3px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  margin-right: 6px; margin-bottom: 6px; border: 1px solid;
}
.tag.good { background: #E7EFD9; color: #4C5E2B; border-color: #C4D4A4; }
.tag.warn { background: #F5E8D8; color: #8C5A22; border-color: #E3C79B; }
.tag.bad  { background: #F3DEDA; color: #8C3A2A; border-color: #E3AFA2; }
.tag.neutral { background: #EDE7D6; color: #5C5638; border-color: #D7CDAF; }

.kpi-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px; margin-bottom: 24px;
}
.kpi-card {
  background: #FBF8F1; border: 1px solid #DCD3BE; border-radius: 4px;
  padding: 18px 20px; position: relative; overflow: hidden;
}
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
  background: var(--accent, #6B7F3E);
}
.kpi-label {
  font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.08em;
  text-transform: uppercase; color: #8A7F63; margin-bottom: 8px; padding-left: 8px;
}
.kpi-value { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; color: #2E3420; line-height: 1; padding-left: 8px; }
.kpi-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A7F63; margin-top: 6px; padding-left: 8px; }

.panels { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 20px; margin-bottom: 20px; }
.panel { background: #FBF8F1; border: 1px solid #DCD3BE; border-radius: 6px; padding: 20px 22px; }
.panel-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: #2E3420; margin-bottom: 16px; }

.bar-row { margin-bottom: 10px; }
.bar-label-row { display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #4A4530; margin-bottom: 3px; }
.bar-label-row .count { color: #8A7F63; }
.bar-track { background: #E8E2D0; border-radius: 2px; height: 8px; overflow: hidden; }
.bar-fill { height: 100%; transition: width 0.5s ease; }

.subsection-divider { margin-top: 18px; padding-top: 14px; border-top: 1px solid #E8E2D0; }

.footnote { margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A69A78; text-align: center; }

.narrative-trigger-row { display: flex; justify-content: flex-end; margin-bottom: 16px; }
.narrative-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px; border-radius: 4px; border: 1px solid #6B7F3E;
  background: #6B7F3E; color: #F4F0E4;
  font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.02em;
  cursor: pointer; transition: all 0.15s ease;
}
.narrative-btn:hover { background: #5A6B33; border-color: #5A6B33; }
.narrative-btn.secondary {
  background: transparent; color: #6B7F3E;
}
.narrative-btn.secondary:hover { background: #E7EFD9; }

#narrativePanel {
  display: none; background: #FFFDF8; border: 1px solid #DCD3BE; border-left: 4px solid #8C5A22;
  border-radius: 6px; padding: 26px 28px; margin-bottom: 24px;
}
.narrative-header {
  display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px;
  padding-bottom: 14px; border-bottom: 1px solid #E8E2D0;
}
.narrative-eyebrow {
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  letter-spacing: 0.08em; text-transform: uppercase; color: #8C5A22; margin-bottom: 4px;
}
.narrative-title { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 700; color: #2E3420; }
.narrative-close {
  background: transparent; border: 1px solid #DCD3BE; border-radius: 4px; padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A7F63; cursor: pointer;
}
.narrative-body { font-family: 'Inter', sans-serif; font-size: 15px; line-height: 1.7; color: #3A3826; }
.narrative-body h3 {
  font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; color: #2E3420;
  margin: 20px 0 8px 0;
}
.narrative-body h3:first-child { margin-top: 0; }
.narrative-body p { margin-bottom: 10px; }
.narrative-body strong { color: #2E3420; font-weight: 600; }
.narrative-body ul { margin: 6px 0 12px 20px; }
.narrative-body li { margin-bottom: 4px; }
.narrative-footer {
  margin-top: 18px; padding-top: 14px; border-top: 1px solid #E8E2D0;
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
}
.narrative-meta { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A69A78; }

@media (max-width: 800px) {
  .container { padding: 20px; }
  .header { padding: 24px 20px; }
  .profile-cols { grid-template-columns: 1fr; }
  .panels { grid-template-columns: 1fr; }
}
</style>

const MUNICIPIOS = ['Todos', 'San Marcos', 'Palo Gordo', 'Tejutla'];

let state = { municipio: 'Todos', query: '', selectedId: null };

function pct(n, total) { return total ? Math.round((n / total) * 100) + '%' : '0%'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function munCounts() {
  const counts = {};
  PRODUCTORES.forEach(p => { counts[p.municipio] = (counts[p.municipio] || 0) + 1; });
  return counts;
}

function renderMunButtons() {
  const counts = munCounts();
  const el = document.getElementById('munButtons');
  el.innerHTML = MUNICIPIOS.map(m => {
    const n = m === 'Todos' ? PRODUCTORES.length : counts[m];
    const active = state.municipio === m ? 'active' : '';
    return `<button class="mun-btn ${active}" data-mun="${esc(m)}">${esc(m)} (${n})</button>`;
  }).join('');
  el.querySelectorAll('.mun-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.municipio = btn.getAttribute('data-mun');
      state.selectedId = null;
      render();
    });
  });
}

function getScope() {
  return state.municipio === 'Todos' ? PRODUCTORES : PRODUCTORES.filter(p => p.municipio === state.municipio);
}

function getFiltered() {
  return PRODUCTORES.filter(p => {
    const matchMun = state.municipio === 'Todos' || p.municipio === state.municipio;
    const matchQ = !state.query || p.nombre.toLowerCase().includes(state.query.toLowerCase());
    return matchMun && matchQ;
  });
}

function renderResultList() {
  const el = document.getElementById('resultList');
  if (state.selectedId || !state.query) { el.style.display = 'none'; el.innerHTML = ''; return; }
  const filtered = getFiltered();
  el.style.display = 'block';
  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty-msg">Sin coincidencias para "${esc(state.query)}"</div>`;
    return;
  }
  el.innerHTML = filtered.slice(0, 20).map(p => `
    <div class="result-row card-hover" data-id="${esc(p.id)}">
      <div>
        <div class="name">${esc(p.nombre)}</div>
        <div class="meta">${esc(p.municipio)} · ${p.edad} años · ${esc(p.genero)}</div>
      </div>
      <div class="rid">ID ${esc(p.id)}</div>
    </div>
  `).join('');
  el.querySelectorAll('.result-row').forEach(row => {
    row.addEventListener('click', () => {
      state.selectedId = row.getAttribute('data-id');
      render();
    });
  });
}

function barRow(label, value, total, color) {
  const w = total ? (value / total) * 100 : 0;
  return `
    <div class="bar-row">
      <div class="bar-label-row"><span>${esc(label)}</span><span class="count">${value} · ${pct(value, total)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${w}%;background:${color}"></div></div>
    </div>
  `;
}

      <div class="panel">
        <div class="panel-title">Composición por género</div>
        ${barRow('Mujeres', nMujeres, total, '#B5654A')}
        ${barRow('Hombres', nHombres, total, '#4C7B9E')}
        <div class="subsection-divider">
          <div class="section-label" style="margin-top:0">Sanidad del cultivo</div>
          ${barRow('Reportan plagas de insectos', nPlagas, total, '#C9861F')}
          ${barRow('Mosca blanca', nMoscaBlanca, total, '#C9861F')}
          ${barRow('Bacterias', nBacterias, total, '#A34433')}
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Variedades de tomate más utilizadas</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));gap:4px 24px">
        ${topVariedades.map(([name, count]) => barRow(name, count, total, '#6B7F3E')).join('')}
      </div>
    </div>

    <div class="footnote">Escribe un nombre arriba para buscar la ficha de un productor individual</div>
  `;
  document.getElementById('narrativeBtn').addEventListener('click', generateNarrative);
}

// ── Generación de narrativa ──────────────────────────────────

function pctNum(n, total) { return total ? Math.round((n / total) * 100) : 0; }

function topEntries(counter, n) {
  return Object.entries(counter).sort((a, b) => b[1] - a[1]).slice(0, n);
}

function buildAggregateStats(scope) {
  const total = scope.length;
  const nInvernadero = scope.filter(p => p.invernadero).length;
  const nMacroTunel = scope.filter(p => p.macroTunel).length;
  const nCasaMalla = scope.filter(p => p.casaMalla).length;
  const nNinguna = scope.filter(p => !p.invernadero && !p.macroTunel && !p.casaMalla).length;
  const nAsistencia = scope.filter(p => p.asistenciaTecnica).length;
  const nRiego = scope.filter(p => p.riego).length;
  const nMujeres = scope.filter(p => p.genero === 'Mujeres').length;
  const nHombres = scope.filter(p => p.genero === 'Hombres').length;
  const nPlagas = scope.filter(p => p.tieneInsectos).length;
  const nMoscaBlanca = scope.filter(p => p.moscaBlanca).length;
  const nAranaRoja = scope.filter(p => p.aranaRoja).length;
  const nBacterias = scope.filter(p => p.tieneBacterias).length;
  const nVirus = scope.filter(p => p.tieneVirus).length;
  const nMercado = scope.filter(p => p.destinoMercado).length;
  const nFamiliar = scope.filter(p => p.destinoFamiliar).length;
  const nSoloFamiliar = scope.filter(p => p.destinoFamiliar && !p.destinoMercado).length;
  const areas = scope.map(p => p.areaParcela).filter(a => a > 0);
  const avgArea = areas.length ? Math.round(areas.reduce((a, b) => a + b, 0) / areas.length) : 0;
  const avgEdad = total ? Math.round(scope.reduce((s, p) => s + p.edad, 0) / total) : 0;
  const nJovenes = scope.filter(p => p.edad < 35).length;
  const nMayores = scope.filter(p => p.edad >= 60).length;

  const expCounter = {};
  scope.forEach(p => { expCounter[p.experiencia] = (expCounter[p.experiencia] || 0) + 1; });

  const varCounter = {};
  scope.forEach(p => {
    [p.varDeterminada, p.varIndeterminada].forEach(v => { if (v) varCounter[v] = (varCounter[v] || 0) + 1; });
  });

  const munCounter = {};
  scope.forEach(p => { munCounter[p.municipio] = (munCounter[p.municipio] || 0) + 1; });

  return {
    total, nInvernadero, nMacroTunel, nCasaMalla, nNinguna, nAsistencia, nRiego,
    nMujeres, nHombres, nPlagas, nMoscaBlanca, nAranaRoja, nBacterias, nVirus,
    nMercado, nFamiliar, nSoloFamiliar, avgArea, avgEdad, nJovenes, nMayores,
    expCounter, varCounter, munCounter
  };
}

function renderAggregateNarrative(scopeLabel, s) {
  const p = (n) => pctNum(n, s.total);
  const topVars = topEntries(s.varCounter, 3);
  const topVarsStr = topVars.map(([name, count]) => `<strong>${esc(name)}</strong> (${count} productores, ${p(count)}%)`).join(', ');

  const estructurasParts = [];
  if (s.nInvernadero) estructurasParts.push(`invernadero (${p(s.nInvernadero)}%)`);
  if (s.nMacroTunel) estructurasParts.push(`macro túnel (${p(s.nMacroTunel)}%)`);
  if (s.nCasaMalla) estructurasParts.push(`casa malla (${p(s.nCasaMalla)}%)`);
  const estructuraDominante = [
    ['Invernadero', s.nInvernadero], ['Macro túnel', s.nMacroTunel], ['Casa malla', s.nCasaMalla]
  ].sort((a, b) => b[1] - a[1])[0];

  const riesgoSanitario = p(s.nPlagas) >= 70 ? 'alta' : (p(s.nPlagas) >= 40 ? 'moderada' : 'baja');
  const brechaRiego = s.total - s.nRiego;
  const brechaAsistencia = s.total - s.nAsistencia;

  let munBreakdown = '';
  if (Object.keys(s.munCounter).length > 1) {
    const rows = Object.entries(s.munCounter).sort((a,b) => b[1]-a[1])
      .map(([m, n]) => `<li><strong>${esc(m)}</strong>: ${n} productores (${p(n)}%)</li>`).join('');
    munBreakdown = `<h3>Distribución geográfica</h3><ul>${rows}</ul>`;
  }

  return `
    <h3>Perfil general</h3>
    <p>El estudio cubre <strong>${s.total} productores</strong> de tomate en ${scopeLabel}, con una edad promedio de <strong>${s.avgEdad} años</strong> y un área de parcela promedio de <strong>${s.avgArea.toLocaleString()} m²</strong>. La composición por género muestra <strong>${p(s.nMujeres)}% mujeres</strong> y <strong>${p(s.nHombres)}% hombres</strong>. ${s.nJovenes > 0 ? `Un <strong>${p(s.nJovenes)}%</strong> son productores jóvenes (menores de 35 años), ` : ''}${s.nMayores > 0 ? `mientras que un <strong>${p(s.nMayores)}%</strong> tiene 60 años o más.` : ''}</p>

    ${munBreakdown}

    <h3>Estructuras de producción</h3>
    <p>La estructura predominante es <strong>${estructuraDominante[0]}</strong>, usada por ${p(estructuraDominante[1])}% de los productores. En conjunto: ${estructurasParts.join(', ')}.${s.nNinguna > 0 ? ` <strong>${s.nNinguna} productores (${p(s.nNinguna)}%)</strong> no reportan ninguna estructura protegida, lo que sugiere producción a cielo abierto o un vacío de datos que vale la pena verificar en campo.` : ''}</p>

    <h3>Acceso a riego y asistencia técnica</h3>
    <p><strong>${p(s.nRiego)}%</strong> de los productores cuenta con sistema de riego${brechaRiego > 0 ? `, dejando una brecha de <strong>${brechaRiego} productores sin riego</strong> — un punto de atención directo para intervenciones de infraestructura hídrica.` : '.'} En cuanto a acompañamiento técnico, solo <strong>${p(s.nAsistencia)}%</strong> ha recibido asistencia técnica institucional${brechaAsistencia > 0 ? `, lo que deja a <strong>${brechaAsistencia} productores (${p(brechaAsistencia)}%)</strong> sin ese respaldo — la brecha más significativa para escalar capacitación.` : '.'}</p>

    <h3>Sanidad del cultivo</h3>
    <p>La presión de plagas es <strong>${riesgoSanitario}</strong>: <strong>${p(s.nPlagas)}%</strong> de los productores reporta problemas con insectos, principalmente <strong>mosca blanca</strong> (${p(s.nMoscaBlanca)}%)${s.nAranaRoja > 0 ? ` y araña roja (${p(s.nAranaRoja)}%)` : ''}. Adicionalmente, <strong>${p(s.nBacterias)}%</strong> reporta problemas bacterianos${s.nVirus > 0 ? ` y <strong>${p(s.nVirus)}%</strong> reporta presencia viral` : ''}. La combinación de alta incidencia de mosca blanca y presencia viral es una señal de alerta agronómica, dado que la mosca blanca es vector de virosis en tomate.</p>

    <h3>Variedades y destino de la producción</h3>
    <p>Las variedades más utilizadas son ${topVarsStr || 'sin un patrón dominante claro'}. Sobre el destino de la cosecha, <strong>${p(s.nMercado)}%</strong> vende en el mercado local y <strong>${p(s.nFamiliar)}%</strong> destina parte a consumo familiar.${s.nSoloFamiliar > 0 ? ` <strong>${s.nSoloFamiliar} productores (${p(s.nSoloFamiliar)}%)</strong> producen exclusivamente para autoconsumo, sin conexión comercial — un segmento candidato para intervenciones de vinculación a mercado.` : ''}</p>

    <h3>Lectura general</h3>
    <p>El perfil combinado sugiere una base productiva con adopción moderada-alta de estructuras protegidas pero con dos brechas claras de intervención: <strong>cobertura de riego</strong> y <strong>alcance de asistencia técnica</strong>, ambas por debajo del 100% de la población. La presión sanitaria por mosca blanca amerita seguimiento, dado su vínculo con la transmisión viral observada en el estudio.</p>
  `;
}

function renderProducerNarrative(p) {
  const estructuras = [];
  if (p.invernadero) estructuras.push('invernadero');
  if (p.macroTunel) estructuras.push('macro túnel');
  if (p.casaMalla) estructuras.push('casa malla');

  const sanidadIssues = [];
  if (p.tieneInsectos) sanidadIssues.push('presencia de insectos' + (p.moscaBlanca ? ' (mosca blanca)' : '') + (p.aranaRoja ? (p.moscaBlanca ? ' y araña roja' : ' (araña roja)') : ''));
  if (p.tieneBacterias) sanidadIssues.push('problemas bacterianos');
  if (p.tieneVirus) sanidadIssues.push('presencia viral');

  const variedades = [p.varDeterminada, p.varIndeterminada].filter(Boolean);

  return `
    <h3>Resumen del productor</h3>
    <p><strong>${esc(p.nombre)}</strong>, de ${p.edad} años, cultiva tomate en el municipio de <strong>${esc(p.municipio)}</strong> sobre una parcela de <strong>${p.areaParcela.toLocaleString()} m²</strong>, con ${p.experiencia === '0 a 5' ? 'entre 0 y 5 años' : (p.experiencia === '6 a 10' ? 'entre 6 y 10 años' : 'más de 11 años')} de experiencia en el cultivo.</p>

    <h3>Producción</h3>
    <p>${estructuras.length ? `Utiliza <strong>${estructuras.join(', ')}</strong> como estructura(s) de producción.` : 'No reporta uso de estructuras protegidas (invernadero, macro túnel o casa malla).'} ${p.riego ? 'Cuenta con sistema de riego.' : '<strong>No cuenta con sistema de riego</strong>, lo que representa una limitación productiva relevante.'} ${p.asistenciaTecnica ? 'Ha recibido asistencia técnica institucional.' : '<strong>No ha recibido asistencia técnica</strong> — candidato prioritario para programas de acompañamiento.'}</p>

    ${variedades.length ? `<h3>Variedades</h3><p>Trabaja con la(s) variedad(es): <strong>${variedades.map(esc).join(', ')}</strong>.</p>` : ''}

    <h3>Sanidad del cultivo</h3>
    <p>${sanidadIssues.length ? `Reporta ${sanidadIssues.join(', ')}.` : 'No reporta problemas sanitarios significativos en el cultivo.'}</p>

    <h3>Destino de la producción</h3>
    <p>${p.destinoFamiliar && p.destinoMercado ? 'Destina la cosecha tanto a consumo familiar como a venta en mercado local.' : (p.destinoMercado ? 'Destina la producción principalmente al mercado local.' : (p.destinoFamiliar ? 'Produce exclusivamente para consumo familiar, sin vínculo comercial reportado.' : 'No se reporta destino claro de la producción.'))}</p>
  `;
}

function generateNarrative() {
  const panel = document.getElementById('narrativePanel');
  let bodyHtml, title, eyebrow;

  if (state.selectedId) {
    const p = PRODUCTORES.find(x => x.id === state.selectedId);
    title = 'Narrativa individual: ' + p.nombre;
    eyebrow = 'Análisis generado · Ficha de productor';
    bodyHtml = renderProducerNarrative(p);
  } else {
    const scope = getScope();
    const scopeLabel = state.municipio === 'Todos' ? 'los tres municipios del estudio (San Marcos, Palo Gordo, Tejutla)' : `el municipio de ${state.municipio}`;
    title = 'Narrativa de análisis agregado';
    eyebrow = 'Análisis generado · ' + (state.municipio === 'Todos' ? 'Todos los municipios' : state.municipio);
    const stats = buildAggregateStats(scope);
    bodyHtml = renderAggregateNarrative(scopeLabel, stats);
  }

  const now = new Date();
  const dateStr = now.toLocaleDateString('es-GT', { year: 'numeric', month: 'long', day: 'numeric' });

  panel.innerHTML = `
    <div class="narrative-header">
      <div>
        <div class="narrative-eyebrow">${esc(eyebrow)}</div>
        <div class="narrative-title">${esc(title)}</div>
      </div>
      <button class="narrative-close" id="narrativeCloseBtn">Cerrar</button>
    </div>
    <div class="narrative-body">${bodyHtml}</div>
    <div class="narrative-footer">
      <div class="narrative-meta">Generado a partir de los ${PRODUCTORES.length} registros del estudio · ${dateStr}</div>
      <button class="narrative-btn secondary" id="narrativeCopyBtn">Copiar texto</button>
    </div>
  `;
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });

  document.getElementById('narrativeCloseBtn').addEventListener('click', () => {
    panel.style.display = 'none';
  });
  document.getElementById('narrativeCopyBtn').addEventListener('click', () => {
    const text = panel.querySelector('.narrative-body').innerText;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('narrativeCopyBtn');
      const original = btn.textContent;
      btn.textContent = 'Copiado';
      setTimeout(() => { btn.textContent = original; }, 1500);
    });
  });
}

function render() {
  renderMunButtons();
  renderResultList();
  renderProfile();
  renderSummary();
  // Ocultar narrativa si cambia el contexto de selección/filtro tras generarla
  const panel = document.getElementById('narrativePanel');
  if (panel) panel.style.display = 'none';
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  state.query = e.target.value;
  state.selectedId = null;
  render();
});

render();
</script>
